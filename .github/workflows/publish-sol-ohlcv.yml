name: Publish SOL Paper OHLCV Feed

on:
  schedule:
    # Refresh read-only candles on a staggered ten-minute UTC schedule.
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-sol-ohlcv.yml

permissions:
  contents: write

concurrency:
  group: sol-public-candle-feed
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout isolated market-data branch
        uses: actions/checkout@v4
        with:
          ref: sol-ohlcv-feed
          fetch-depth: 1
          persist-credentials: true
      - name: Validate Kraken OHLCV with Binance.US fallback
        run: |
          set -euo pipefail
          if python3 scripts/build_sol_ohlcv_feed.py market/ohlcv; then
            echo "Primary Kraken OHLCV validation passed"
          else
            echo "Primary Kraken failed; attempting independent Binance.US fallback"
            python3 scripts/build_binanceus_ohlcv_feed.py market/ohlcv
          fi
      - name: Publish only passing snapshots to isolated branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market/ohlcv/*.json
          if git diff --cached --quiet; then
            echo "No market-data changes"
            exit 0
          fi
          git commit -m "Update validated SOL/BTC public OHLCV snapshots"
          git push origin HEAD:sol-ohlcv-feed
