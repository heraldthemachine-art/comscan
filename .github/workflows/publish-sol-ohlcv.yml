name: Publish SOL Paper OHLCV Feed

on:
  schedule:
    # Refresh read-only completed candles every five minutes, two minutes after UTC bar boundaries.
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-sol-ohlcv.yml

permissions:
  contents: write

concurrency:
  group: sol-public-candle-feed
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Record actual runner start (GitHub scheduled jobs may be delayed)
        run: |
          date -u '+Runner start UTC: %Y-%m-%dT%H:%M:%SZ'
      - name: Checkout isolated market-data branch
        uses: actions/checkout@v4
        with:
          ref: sol-ohlcv-feed
          fetch-depth: 1
          persist-credentials: true
      - name: Validate Kraken OHLCV with Binance.US fallback
        run: |
          set -euo pipefail
          if python3 scripts/build_sol_ohlcv_feed.py market/ohlcv; then
            echo "Primary Kraken OHLCV validation passed"
          else
            echo "Primary Kraken failed; attempting independent Binance.US fallback"
            python3 scripts/build_binanceus_ohlcv_feed.py market/ohlcv
          fi
      - name: Smoke-test public quote verification (offline fixtures)
        continue-on-error: true
        run: |
          python3 -m unittest discover -s tests -p 'test_public_spot_quotes.py' -v
      - name: Attach independent timed SOL/BTC spot evidence (optional)
        run: |
          set -euo pipefail
          # A quote-provider outage must never block valid candle publication.
          # The quote script records DATA_UNAVAILABLE, not fabricated quotes.
          if python3 scripts/attach_public_spot_quotes.py market/ohlcv; then
            echo "Public quote audit recorded in manifest"
          else
            echo "::warning::Quote audit unavailable; candle feed still publishes, no quotes claimed"
          fi
      - name: Publish only passing snapshots to isolated branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market/ohlcv/*.json
          if git diff --cached --quiet; then
            echo "No market-data changes"
            exit 0
          fi
          git commit -m "Update validated SOL/BTC public OHLCV snapshots"
          git push origin HEAD:sol-ohlcv-feed
          date -u '+Feed published UTC: %Y-%m-%dT%H:%M:%SZ'
